[package]
name = "osteo-manager"
version = "0.2.0"
description = "Gestion de cabinet d'ostéopathie"
authors = ["Timothée Faget"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "osteo_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher"] }
thiserror = "2.0.21"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
hex = "0.4.3"
tar = "0.4.46"
tauri-plugin-dialog = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tauri-plugin-updater = "2"
base64 = "0.23.1"
unicode-normalization = "0.1.25"
krilla = "0.8.2"
skrifa = "0.42"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# Argon2 is unusably slow unoptimized (64 MiB derivation at every unlock in `tauri dev`).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
